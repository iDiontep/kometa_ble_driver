[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kometa"
version = "0.1.0"
description = "Python BLE host driver for CellerLab KOMETA d1 and d2"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "CellerLab" }]
dependencies = [
    "bleak>=2.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
kometa = "kometa.cli:main"
kometa-gui = "kometa.gui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
